[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-ai-coach"
version = "1.5.0"
description = "Local-first, agent-native English learning system (Yanxi)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "IELTS AI Coach contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12",
  "jsonschema>=4.22",
  "filelock>=3.15",
  "keyring>=25,<26",
  "lemminflect>=0.2.3"
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
  "Pillow>=10.4",
  "pypdf>=5,<7",
]
ocr = [
  "pypdfium2>=4.30,<6",
  "rapidocr-onnxruntime>=1.4.4,<2",
]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.2", "ruff>=0.9"]

[project.scripts]
xiyan = "ielts_coach.cli:app"
# Compatibility alias kept for v1.4 users and existing automation.
ielts-coach = "ielts_coach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"ielts_coach.resources" = [
  "assets/*",
  "evaluations/*.json",
  "schemas/*.json",
  "words/*.json",
  "words/enrichments/*.jsonl"
]
"ielts_coach.web" = [
  "static/index.html",
  "static/*.png",
  "static/assets/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "build", "dist", "release-artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
  "B008",  # FastAPI Depends/Query/File default patterns are intentional
  "B904",  # raise ... from ... chaining is handled deliberately
  "UP007",  # X | None union style is intentional across the codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
