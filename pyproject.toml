[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-ai-coach"
version = "1.4.0"
description = "Local-first, agent-native IELTS Academic learning system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "IELTS AI Coach contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "typer>=0.12",
  "jsonschema>=4.22",
  "filelock>=3.15",
  "keyring>=25,<26"
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
  "Pillow>=10.4",
  "pypdf>=5,<7",
]
ocr = [
  "pypdfium2>=4.30,<6",
  "rapidocr-onnxruntime>=1.4.4,<2",
]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.2"]

[project.scripts]
ielts-coach = "ielts_coach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"ielts_coach.resources" = [
  "assets/*",
  "schemas/*.json"
]
"ielts_coach.web" = [
  "static/index.html",
  "static/*.png",
  "static/assets/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
